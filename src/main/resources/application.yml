spring:
  application:
    name: ms-mensajeria
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

# Render standalone:
# Eureka queda apagado porque Render levantará solo este microservicio.
eureka:
  client:
    enabled: false

# Render standalone:
# URLs remotas comentadas para evitar llamadas a microservicios dormidos/no desplegados.
# Reactivar cuando se despliegue el ecosistema completo.
# ms:
#   inquilinos:
#     url: ${MS_INQUILINOS_URL:http://localhost:8083}
#   reservas:
#     url: ${MS_RESERVAS_URL:http://localhost:8084}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update